<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="516" viewBox="0 0 1320 516" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Batch lifecycle</title>
  <desc id="desc">Each batch goes through DetectBatch, CheckBatch, ValidateBatch, TransformBatch and VerifyBatch and ends as PUBLISHED, ALREADY_PROCESSED, QUARANTINED or FAILED. Evidence runs A to D show the skip and retry behaviour on real data.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #334155; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .h1 { font-size: 18px; font-weight: 600; fill: #0f172a; }
      .sub { font-size: 12.5px; fill: #64748b; }
      .step { font-size: 12.5px; font-weight: 600; fill: #0f172a; }
      .body { font-size: 11px; fill: #475569; }
      .bodym { font-size: 10.5px; fill: #475569; }
      .note { font-size: 10.5px; fill: #64748b; }
      .label { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #94a3b8; }
      .pill { font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .flow { fill: none; stroke: #475569; stroke-width: 1.5; }
      .badge { fill: #0f172a; }
      .badge-t { font-size: 10px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1319" height="515" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="32" y="44" class="h1">Batch lifecycle</text>
  <text x="32" y="66" class="sub">What one service × month batch goes through on every run. The end states are what status.txt and batch_history.jsonl report.</text>

  <!-- main path -->
  <rect x="95" y="132" width="140" height="64" rx="10" class="box"/>
  <circle cx="95" cy="132" r="9" class="badge"/><text x="95" y="135.5" class="badge-t" text-anchor="middle">1</text>
  <text x="165" y="159" class="step mono" text-anchor="middle">DetectBatch</text>
  <text x="165" y="179" class="body" text-anchor="middle">download or reuse raw</text>

  <rect x="293" y="132" width="140" height="64" rx="10" class="box"/>
  <circle cx="293" cy="132" r="9" class="badge"/><text x="293" y="135.5" class="badge-t" text-anchor="middle">2</text>
  <text x="363" y="159" class="step mono" text-anchor="middle">CheckBatch</text>
  <text x="363" y="179" class="body" text-anchor="middle">is this batch done?</text>

  <rect x="491" y="132" width="140" height="64" rx="10" class="box"/>
  <circle cx="491" cy="132" r="9" class="badge"/><text x="491" y="135.5" class="badge-t" text-anchor="middle">3</text>
  <text x="561" y="159" class="step mono" text-anchor="middle">ValidateBatch</text>
  <text x="561" y="179" class="body" text-anchor="middle">BLOCK · REJECT · WARN</text>

  <rect x="689" y="132" width="140" height="64" rx="10" class="box"/>
  <circle cx="689" cy="132" r="9" class="badge"/><text x="689" y="135.5" class="badge-t" text-anchor="middle">4</text>
  <text x="759" y="159" class="step mono" text-anchor="middle">TransformBatch</text>
  <text x="759" y="179" class="body" text-anchor="middle">staging, then replace</text>

  <rect x="887" y="132" width="140" height="64" rx="10" class="box"/>
  <circle cx="887" cy="132" r="9" class="badge"/><text x="887" y="135.5" class="badge-t" text-anchor="middle">5</text>
  <text x="957" y="159" class="step mono" text-anchor="middle">VerifyBatch</text>
  <text x="957" y="179" class="body" text-anchor="middle">re-read written file</text>

  <rect x="1085" y="138" width="140" height="52" rx="26" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="1155" y="161" class="pill" text-anchor="middle" style="fill:#166534">PUBLISHED</text>
  <text x="1155" y="177" class="bodym mono" text-anchor="middle" style="fill:#166534">_SUCCESS.json</text>

  <line x1="235" y1="164" x2="292" y2="164" class="flow" marker-end="url(#arrow)"/>
  <line x1="433" y1="164" x2="490" y2="164" class="flow" marker-end="url(#arrow)"/>
  <text x="462" y="156" class="note" text-anchor="middle">not done</text>
  <line x1="631" y1="164" x2="688" y2="164" class="flow" marker-end="url(#arrow)"/>
  <text x="660" y="156" class="note" text-anchor="middle">pass</text>
  <line x1="829" y1="164" x2="886" y2="164" class="flow" marker-end="url(#arrow)"/>
  <line x1="1027" y1="164" x2="1084" y2="164" class="flow" marker-end="url(#arrow)"/>
  <text x="1056" y="156" class="note" text-anchor="middle">pass</text>

  <!-- exits -->
  <line x1="363" y1="196" x2="363" y2="267" class="flow" marker-end="url(#arrow)"/>
  <text x="372" y="226" class="note">marker, SHA and</text>
  <text x="372" y="240" class="note">fingerprint match</text>
  <rect x="278" y="268" width="170" height="36" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="363" y="290" class="pill" text-anchor="middle" style="fill:#334155">ALREADY_PROCESSED</text>
  <text x="363" y="326" class="note" text-anchor="middle">nothing is rewritten</text>
  <text x="363" y="341" class="note" text-anchor="middle">--force skips this check</text>

  <line x1="561" y1="196" x2="561" y2="267" class="flow" marker-end="url(#arrow)"/>
  <text x="570" y="234" class="note">a BLOCK rule hits</text>
  <rect x="486" y="268" width="150" height="36" rx="18" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="561" y="290" class="pill" text-anchor="middle" style="fill:#92400e">QUARANTINED</text>
  <text x="561" y="326" class="note" text-anchor="middle">whole batch held back</text>
  <text x="561" y="341" class="note" text-anchor="middle">report in quarantine/batches/</text>

  <rect x="680" y="226" width="158" height="78" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="692" y="246" class="label" style="fill:#475569">RETRY-SAFE</text>
  <text x="692" y="264" class="note">one file per batch, so a</text>
  <text x="692" y="279" class="note">rerun replaces it instead</text>
  <text x="692" y="294" class="note">of appending rows again</text>
  <line x1="759" y1="197" x2="759" y2="225" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>

  <line x1="957" y1="196" x2="957" y2="267" class="flow" marker-end="url(#arrow)"/>
  <text x="966" y="226" class="note">check fails</text>
  <text x="966" y="240" class="note">or an error</text>
  <rect x="897" y="268" width="120" height="36" rx="18" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="957" y="290" class="pill" text-anchor="middle" style="fill:#991b1b">FAILED</text>
  <text x="957" y="326" class="note" text-anchor="middle">no marker is written,</text>
  <text x="957" y="341" class="note" text-anchor="middle">so the next run redoes it</text>

  <!-- evidence -->
  <line x1="95" y1="372" x2="1225" y2="372" stroke="#e2e8f0"/>
  <text x="95" y="394" class="label">SEEN IN THE EVIDENCE RUNS</text>

  <rect x="95" y="406" width="266" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="107" y="428" class="step">A · Jan–Mar</text>
  <text x="349" y="428" class="note mono" text-anchor="end">25.7 s</text>
  <circle cx="111" cy="444" r="4" fill="#22c55e"/>
  <text x="121" y="448" class="bodym mono">12 PUBLISHED</text>
  <text x="107" y="472" class="note">first 3 months, rebuilt with --force</text>

  <rect x="383" y="406" width="266" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="395" y="428" class="step">B · Jan–Jun</text>
  <text x="637" y="428" class="note mono" text-anchor="end">29.0 s</text>
  <circle cx="399" cy="444" r="4" fill="#22c55e"/>
  <text x="409" y="448" class="bodym mono">12 PUBLISHED · 12 ALREADY_PROCESSED</text>
  <text x="395" y="472" class="note">new months processed, old ones skipped</text>

  <rect x="671" y="406" width="266" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="683" y="428" class="step">C · Jan–Jun again</text>
  <text x="925" y="428" class="note mono" text-anchor="end">9.2 s</text>
  <circle cx="687" cy="444" r="4" fill="#94a3b8"/>
  <text x="697" y="448" class="bodym mono">24 ALREADY_PROCESSED</text>
  <text x="683" y="472" class="note">same inputs, same output hashes as B</text>

  <rect x="959" y="406" width="266" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="971" y="428" class="step">D · one marker deleted</text>
  <text x="1213" y="428" class="note mono" text-anchor="end">9.4 s</text>
  <circle cx="975" cy="444" r="4" fill="#22c55e"/>
  <text x="985" y="448" class="bodym mono">1 PUBLISHED · 23 ALREADY_PROCESSED</text>
  <text x="971" y="472" class="note">green_2024-03 stays at 57,447 rows</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
